# SonarQube Cloud analysis settings for CI-based analysis.
# The organization and project are expected to be created by the
# Crossplane SonarQube provider; adjust the keys to match what it creates.
sonar.organization=tk-sonarqube-provider
sonar.projectKey=tk-sonarqube-provider_test-repo
sonar.projectName=test-repo

sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
